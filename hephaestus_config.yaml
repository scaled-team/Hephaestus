server:
  host: 0.0.0.0
  port: 8000
  enable_cors: true
paths:
  database: ./data/hephaestus.db
  phases_folder: ./src/workflow/prd_to_software
  worktree_base: /tmp/hephaestus_worktrees
  project_root: ./data/projects/stockton-ai
git:
  main_repo_path: ./data/projects/stockton-ai
  worktree_branch_prefix: agent-
  auto_commit: true
  conflict_resolution: newest_file_wins
llm:
  embedding_model: text-embedding-3-large
  embedding_provider: openai
  default_provider: openrouter
  default_model: openai/gpt-oss-120b
  default_openrouter_provider: cerebras
  default_temperature: 0.7
  default_max_tokens: 4000
  providers:
    openai:
      api_key_env: OPENAI_API_KEY
    openrouter:
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
    groq:
      api_key_env: GROQ_API_KEY
  model_assignments:
    task_enrichment:
      provider: openrouter
      openrouter_provider: Cerebras
      model: openai/gpt-oss-120b
      temperature: 0.7
      max_tokens: 4000
    agent_monitoring:
      provider: openrouter
      openrouter_provider: Cerebras
      model: openai/gpt-oss-120b
      temperature: 0.3
      max_tokens: 2000
    guardian_analysis:
      provider: openrouter
      openrouter_provider: Cerebras
      model: openai/gpt-oss-120b
      temperature: 0.5
      max_tokens: 8000
    conductor_analysis:
      provider: openrouter
      openrouter_provider: Cerebras
      model: openai/gpt-oss-120b
      temperature: 0.4
      max_tokens: 4000
    agent_prompts:
      provider: openrouter
      openrouter_provider: Cerebras
      model: openai/gpt-oss-120b
      temperature: 0.8
      max_tokens: 4000
agents:
  default_cli_tool: opencode
  cli_model: anthropic/claude-haiku-4-5
  tmux_session_prefix: agent
  tmux_socket_path: /tmp/tmux-shared/default
  health_check_interval: 60
  max_health_failures: 3
  termination_delay: 5
vector_store:
  qdrant_url: http://qdrant:6333
  collection_prefix: hephaestus
  embedding_dimension: 3072
monitoring:
  enabled: true
  interval_seconds: 30  # Check every 30 seconds (was 1800 = 30 minutes!)
  log_level: INFO
  log_format: json
  stuck_agent_threshold: 180  # Consider stuck after 3 minutes (was 5 minutes)
  guardian_min_agent_age_seconds: 30  # Analyze agents after 30 seconds (was 60)
  long_running_agent_seconds: 7200  # Nudge agents that run longer than 2 hours without finishing
  cleanup_interval_minutes: 2  # Run zombie cleanup every 2 minutes
mcp:
  auth_required: false
  session_timeout: 3600
  max_concurrent_agents: 6
task_deduplication:
  enabled: true
  similarity_threshold: 0.999
  related_threshold: 0.5
  embedding_model: text-embedding-3-large
  embedding_dimension: 3072
  batch_size: 100
diagnostic_agent:
  enabled: true
  cooldown_seconds: 60  # Reduced from 1800s (30 min) to 60s (1 min)
  min_stuck_time_seconds: 300
  max_agents_to_analyze: 15
  max_conductor_analyses: 5
  max_tasks_per_run: 5
ticket_tracking:
  enabled: true
  default_human_review: false
  default_approval_timeout: 1800
  embedding:
    model: text-embedding-3-large
    dimensions: 3072
    provider: openai
