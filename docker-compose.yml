version: '3.8'

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hephaestus-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Hephaestus MCP Server
  hephaestus-server:
    build: .
    container_name: hephaestus-server
    command: python run_server.py
    ports:
      - "8000:8000"
    volumes:
      # Data persistence
      - ./data:/app/data
      - ./logs:/app/logs
      - ./docs:/app/docs
      # Project workspace
      - ./projects:/app/projects
      # Source code (for development hot-reloading)
      - ./src:/app/src
      - ./scripts:/app/scripts
      # Configuration files
      - ./hephaestus_config.yaml:/app/hephaestus_config.yaml
      - ./opencode.json:/app/opencode.json
      - ./.env:/app/.env
      # Entry point scripts
      - ./run_server.py:/app/run_server.py
      - ./run_monitor.py:/app/run_monitor.py
      - ./run_prd_workflow.py:/app/run_prd_workflow.py
      # Docker socket for tmux session management
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
      - DATABASE_PATH=/app/data/hephaestus.db
      - QDRANT_URL=http://qdrant:6333
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    depends_on:
      - qdrant
    restart: unless-stopped

  # Hephaestus Monitoring Loop
  hephaestus-monitor:
    build: .
    container_name: hephaestus-monitor
    command: python run_monitor.py
    volumes:
      # Data persistence
      - ./data:/app/data
      - ./logs:/app/logs
      - ./docs:/app/docs
      # Project workspace
      - ./projects:/app/projects
      # Source code (for development hot-reloading)
      - ./src:/app/src
      - ./scripts:/app/scripts
      # Configuration files
      - ./hephaestus_config.yaml:/app/hephaestus_config.yaml
      - ./opencode.json:/app/opencode.json
      - ./.env:/app/.env
      # Entry point scripts
      - ./run_server.py:/app/run_server.py
      - ./run_monitor.py:/app/run_monitor.py
      - ./run_prd_workflow.py:/app/run_prd_workflow.py
      # Docker socket for tmux session management
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
      - DATABASE_PATH=/app/data/hephaestus.db
      - QDRANT_URL=http://qdrant:6333
      - MONITORING_INTERVAL_SECONDS=${MONITORING_INTERVAL_SECONDS:-60}
    depends_on:
      - qdrant
      - hephaestus-server
    restart: unless-stopped

  # Frontend Development Server
  frontend:
    build: ./frontend
    container_name: hephaestus-frontend
    ports:
      - "5173:5173"
    volumes:
      # Development source code mounts for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # node_modules volume for persistence (prevents reinstall on restart)
      - frontend_node_modules:/app/node_modules
    environment:
      # Backend URLs for Docker networking
      - BACKEND_URL=http://hephaestus-server:8000
      - BACKEND_WS_URL=ws://hephaestus-server:8000
      - NODE_ENV=development
    depends_on:
      - hephaestus-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  qdrant_data:
  frontend_node_modules: