# ═══════════════════════════════════════════════════════════════════════════════
# Hephaestus Docker Compose Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# This Docker Compose configuration sets up the complete Hephaestus MCP server
# infrastructure including the main server, monitoring loop, Qdrant vector store,
# and frontend development server.
#
# CRITICAL: OpenCode agents running in these containers can ONLY write to:
# - /app/data/    (host: ./data/ - contains ALL persistent data including logs, docs, worktrees, projects)
# - /app/src/     (host: ./src/)
# - /app/scripts/ (host: ./scripts/)
#
# FILE ORGANIZATION STRUCTURE:
# ./data/
#   ├── hephaestus.db              (Main database)
#   ├── hephaestus.db.backup*      (Database backups)
#   ├── docs/                       (Generated documentation & reports)
#   ├── logs/                       (Agent execution logs, organized by agent ID)
#   ├── projects/                   (Project workspaces)
#   ├── worktrees/                  (Agent git worktrees)
#   └── qdrant_storage/             (Vector database persistence)
#
# Any attempt to write outside these paths will fail with "Write outside of project scope" error.
# See OPENCODE_FILE_WRITE_GUIDE.md and OPENCODE_QUICK_REFERENCE.md for details.
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hephaestus-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # Hephaestus MCP Server - Main Server for Agent Coordination
  # ───────────────────────────────────────────────────────────────────────────
  # Primary server that orchestrates agent execution, manages memory storage,
  # and coordinates with Qdrant vector database for semantic search.
  #
  # File Write Rules for OpenCode Agents:
  # Only the following paths are writable. Any other path will cause errors:
  # - /app/data/         → Database files, cached data, agent memories, logs, docs, projects, worktrees
  # - /app/src/          → Source code modifications, new modules
  # - /app/scripts/      → Script files, automation tools
  # ───────────────────────────────────────────────────────────────────────────
  hephaestus-server:
    build: .
    container_name: hephaestus-server
    command: python run_server.py
    ports:
      - "8000:8000"
    volumes:
      # ┌─ DATA PERSISTENCE MOUNTS (Writable by agents) ─────────────────────
      # All persistent data consolidated in ./data/ folder
      - ./data:/app/data                      # ✅ Writable - All persistent data
      - ./data/logs:/app/logs                 # ✅ Writable - All log files
      - ./data/docs:/app/docs                 # ✅ Writable - Documentation, reports
      # └─────────────────────────────────────────────────────────────────────

      # ┌─ PROJECT WORKSPACE MOUNTS (Writable by agents) ───────────────────
      # Project-specific workspaces and build artifacts (in ./data/)
      - ./data/projects:/app/projects         # ✅ Writable - Project workspaces
      - ./data/worktrees:/tmp/hephaestus_worktrees  # ✅ Writable - Agent git worktrees
      # └─────────────────────────────────────────────────────────────────────

      # ┌─ SOURCE CODE MOUNTS (Writable by agents) ──────────────────────────
      # Development source code with hot-reloading capability
      - ./src:/app/src                # ✅ Writable - Application source
      - ./scripts:/app/scripts        # ✅ Writable - Utility scripts
      - ./opencode.json:/app/opencode.json  # ✅ OpenCode CLI configuration
      # └─────────────────────────────────────────────────────────────────────

      # ┌─ CONFIGURATION MOUNTS (Read-only) ─────────────────────────────────
      # Configuration files - agents should NOT modify these
      - ./hephaestus_config.yaml:/app/hephaestus_config.yaml  # 🔒 Read-only
      - ./opencode.json:/app/opencode.json                    # 🔒 Read-only
      - ./opencode.json:/root/.config/opencode/opencode.json  # 🔒 Read-only
      - ./.env:/app/.env                                      # 🔒 Read-only
      # └─────────────────────────────────────────────────────────────────────

      # ┌─ ENTRY POINT SCRIPTS (Read-only) ──────────────────────────────────
      # Server startup and utility scripts
      - ./run_server.py:/app/run_server.py                    # 🔒 Read-only
      - ./run_monitor.py:/app/run_monitor.py                  # 🔒 Read-only
      - ./run_prd_workflow.py:/app/run_prd_workflow.py        # 🔒 Read-only
      # └─────────────────────────────────────────────────────────────────────

      # ┌─ SYSTEM MOUNTS ─────────────────────────────────────────────────────
      # Docker socket for tmux session management (read-write for container mgmt)
      - /var/run/docker.sock:/var/run/docker.sock
      # └─────────────────────────────────────────────────────────────────────
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4.5-20251001}
      - DATABASE_PATH=/app/data/hephaestus.db
      - QDRANT_URL=http://qdrant:6333
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - HEPHAESTUS_PHASES_FOLDER=/app/src/workflow/prd_to_software
    depends_on:
      - qdrant
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # Hephaestus Monitoring Loop - Health and Progress Tracking
  # ───────────────────────────────────────────────────────────────────────────
  # Continuous monitoring service that tracks server health, agent progress,
  # and system state. Writes monitoring logs and metrics to /app/logs/.
  #
  # Same volume mount restrictions apply - see hephaestus-server above.
  # ───────────────────────────────────────────────────────────────────────────
  hephaestus-monitor:
    build: .
    container_name: hephaestus-monitor
    command: python run_monitor.py
    volumes:
      # Data persistence mounts (same as server, consolidated in ./data/)
      - ./data:/app/data                      # ✅ Writable - Monitoring data
      - ./data/logs:/app/logs                 # ✅ Writable - Monitoring logs
      - ./data/docs:/app/docs                 # ✅ Writable - Status reports

      # Project workspace (in ./data/)
      - ./data/projects:/app/projects         # ✅ Writable - Project state
      - ./data/worktrees:/tmp/hephaestus_worktrees  # ✅ Writable - Agent git worktrees

      # Source code
      - ./src:/app/src                # ✅ Writable - Code modifications
      - ./scripts:/app/scripts        # ✅ Writable - Monitoring scripts

      # Configuration files (read-only)
      - ./hephaestus_config.yaml:/app/hephaestus_config.yaml  # 🔒 Read-only
      - ./opencode.json:/app/opencode.json                    # 🔒 Read-only
      - ./opencode.json:/root/.config/opencode/opencode.json  # 🔒 Read-only
      - ./.env:/app/.env                                      # 🔒 Read-only

      # Entry point scripts (read-only)
      - ./run_server.py:/app/run_server.py                    # 🔒 Read-only
      - ./run_monitor.py:/app/run_monitor.py                  # 🔒 Read-only
      - ./run_prd_workflow.py:/app/run_prd_workflow.py        # 🔒 Read-only

      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4.5-20251001}
      - DATABASE_PATH=/app/data/hephaestus.db
      - QDRANT_URL=http://qdrant:6333
      - MONITORING_INTERVAL_SECONDS=${MONITORING_INTERVAL_SECONDS:-60}
    depends_on:
      - qdrant
      - hephaestus-server
    restart: unless-stopped

  # Frontend Development Server
  frontend:
    build: ./frontend
    container_name: hephaestus-frontend
    ports:
      - "5173:5173"
    volumes:
      # Development source code mounts for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # node_modules volume for persistence (prevents reinstall on restart)
      - frontend_node_modules:/app/node_modules
    environment:
      # Backend URLs for Docker networking
      - BACKEND_URL=http://hephaestus-server:8000
      - BACKEND_WS_URL=ws://hephaestus-server:8000
      - NODE_ENV=development
    depends_on:
      - hephaestus-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  qdrant_data:
  frontend_node_modules: